services:
  mysql:
    image: mysql:8.0
    container_name: wholesale_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wholesale_db
      MYSQL_USER: wholesale_user
      MYSQL_PASSWORD: wholesale_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:
